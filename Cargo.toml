[package]
name = "timbre-tsf"
version = "1.0.0"
edition = "2024"
authors = ["Juan José de las Heras"]
description = "High-performance columnar file format for IoT time series"
license = "Apache-2.0"
repository = "https://github.com/juanjodelasheras/timbre-tsf"
keywords = ["timeseries", "iot", "columnar", "compression", "timbre"]
categories = ["database", "compression", "encoding"]
readme = "README.md"

[dependencies]
# Error handling
thiserror = "1.0"

# Logging
log = "0.4"

# Compression
zstd = "0.13"           # Zstd compression (default, 2-3x better than Snappy)
lz4 = "1.28"            # LZ4 (low latency option)
snap = "1.1"            # Snappy (compatibility)
flate2 = "1.0"          # GZIP (maximum compression)

# Serialization
byteorder = "1.5"

# Hashing and checksums
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1.5"

# Indexes
roaring = "0.10"        # Roaring bitmaps for inverted index

# Utilities
bitflags = "2.6"
bit-vec = "0.6"
rustc-hash = "2.0"  # FxHash for fast non-cryptographic hashing

# Arrow integration
arrow = "53"
arrow-array = "53.0"
arrow-schema = "53.0"
arrow-buffer = "53.0"
parquet = "53.0"

# Memory mapping
memmap2 = "0.9"

# Parallelism
rayon = "1.8"

# Optional: for better performance
bumpalo = { version = "3.14", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"
env_logger = "0.11"
rand = "0.8"
bytemuck = "1.14"

[features]
default = []
arena = ["bumpalo"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "parquet_vs_tick"
harness = false

[[bench]]
name = "miniblock_speedup"
harness = false

[[bench]]
name = "parquet_vs_timbre"
harness = false

[[bench]]
name = "compression_rigorous"
harness = false

[[bench]]
name = "encoding_compression_tradeoff"
harness = false

[[bench]]
name = "parquet_vs_timbre_iot"
harness = false

[[bench]]
name = "parquet_vs_timbre_real"
harness = false

[[bench]]
name = "chimp128_vs_gorilla"
harness = false

[[bench]]
name = "simd_encoding"
harness = false

[[bench]]
name = "profile_timbre"
harness = false

[[bench]]
name = "profile_breakdown"
harness = false

[[bench]]
name = "profile_pipeline"
harness = false

[[bench]]
name = "profile_encoding_deep"
harness = false

[[bench]]
name = "profile_perf"
harness = false
